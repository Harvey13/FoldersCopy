name: Validate SFTP source
on:
  push:
    branches: [feature/sftp-source]
  pull_request:
    branches: [main]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check main.js
      - run: node --check src/sftpSource.js
      - run: node --check src/fileProcessor.js
